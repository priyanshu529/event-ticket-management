<div style="margin-top: -2rem;">
  <!-- Hero Section -->
  <div class="hero-section">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">Experience the Extraordinary</h1>
      <p class="hero-subtitle">Discover and book tickets to the most breathtaking events around the world.</p>
      <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;">
        <a routerLink="/events" class="btn btn-primary" style="padding: 1rem 3rem; font-size: 1.2rem; border-radius: 30px;">
          Explore Events
        </a>
      </div>
    </div>
  </div>

  <div class="container" style="padding-top: 4rem;">
    <h2 style="font-size: 2.5rem; margin-bottom: 2rem; text-align: center;">Featured Events</h2>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2.5rem;">
      <a *ngFor="let event of featuredEvents" [routerLink]="['/events', event.id]" class="event-card-modern">
        <!-- Using assets/images for Angular -->
        <div class="event-card-image" [style.backgroundImage]="'url(' + (event.imageUrl ? (event.imageUrl.startsWith('/images') ? '/assets' + event.imageUrl : event.imageUrl) : '/assets/images/event_music_festival.jpg') + ')'">
          <div class="event-card-category">{{ event.category }}</div>
        </div>
        <div class="event-card-content">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
            <h3 style="margin: 0; font-size: 1.4rem;">{{ event.name }}</h3>
          </div>
          <p class="text-secondary" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 1rem;">
            {{ event.description }}
          </p>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="color: var(--text-secondary); font-size: 0.9rem;">
              📅 {{ event.eventDate }} <br/>
              📍 {{ event.city }}
            </div>
            <div style="font-size: 1.3rem; font-weight: bold; color: var(--accent-secondary);">
              ₹{{ event.price | number:'1.2-2' }}
            </div>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>
