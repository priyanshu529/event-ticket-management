<div>
  <h2 style="margin-bottom: 2rem;">Discover Events</h2>
  
  <div class="card" style="margin-bottom: 2rem;">
    <form (ngSubmit)="handleSearch()" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; align-items: end;">
      <div>
        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Event Name</label>
        <input type="text" name="name" class="form-input" placeholder="Search by name..." [(ngModel)]="filters.name" />
      </div>
      <div>
        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">City</label>
        <input type="text" name="city" class="form-input" placeholder="E.g. New York" [(ngModel)]="filters.city" />
      </div>
      <div>
        <label style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Category</label>
        <input type="text" name="category" class="form-input" placeholder="E.g. Music, Tech" [(ngModel)]="filters.category" />
      </div>
      <button type="submit" class="btn btn-primary" style="height: 42px;">Search</button>
    </form>
  </div>

  <div *ngIf="loading" style="text-align: center; padding: 3rem;">
    Loading events...
  </div>

  <div *ngIf="!loading" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem;">
    <p *ngIf="events.length === 0" class="text-secondary" style="grid-column: 1 / -1; text-align: center;">
      No events found matching your criteria.
    </p>

    <ng-container *ngIf="events.length > 0">
      <a *ngFor="let event of events" [routerLink]="['/events', event.id]" class="event-card-modern">
        <div class="event-card-image" [style.backgroundImage]="'url(' + (event.imageUrl ? (event.imageUrl.startsWith('/images') ? '/assets' + event.imageUrl : event.imageUrl) : '/assets/images/event_music_festival.jpg') + ')'">
          <div class="event-card-category">{{ event.category }}</div>
        </div>
        <div class="event-card-content">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
            <h3 style="margin: 0; font-size: 1.4rem;">{{ event.name }}</h3>
          </div>
          <p class="text-secondary" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 1rem;">
            {{ event.description }}
          </p>
          
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="color: var(--text-secondary); font-size: 0.9rem;">
              📅 {{ event.eventDate }} <br/>
              📍 {{ event.city }}
            </div>
            <div style="font-size: 1.3rem; font-weight: bold; color: var(--accent-secondary);">
              ₹{{ event.price | number:'1.2-2' }}
            </div>
          </div>
        </div>
      </a>
    </ng-container>
  </div>
</div>
