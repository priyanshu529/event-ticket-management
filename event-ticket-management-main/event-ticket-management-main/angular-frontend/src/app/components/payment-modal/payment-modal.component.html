<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal-content animate-fade-in">
    
    <ng-container *ngIf="step === 'input'">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <svg width="24" height="24" viewBox="0 0 100 100">
            <path d="M 15 30 L 85 30 C 85 40 95 40 95 50 C 95 60 85 60 85 70 L 15 70 C 15 60 5 60 5 50 C 5 40 15 40 15 30 Z" fill="var(--accent-primary)" />
          </svg>
          <h3 style="margin: 0;">Eventified Pay (Razorpay)</h3>
        </div>
        <button (click)="handleClose()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-secondary);">&times;</button>
      </div>

      <div *ngIf="error" style="color: #ff6b6b; margin-bottom: 1rem; text-align: center;">{{ error }}</div>

      <div style="background: var(--surface-glass-hover); padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; text-align: center;">
        <p style="margin: 0 0 0.5rem 0; color: var(--text-secondary);">Total Amount to Pay</p>
        <h2 style="margin: 0; color: var(--text-primary);">₹{{ amount | number:'1.2-2' }}</h2>
      </div>

      <button (click)="handlePayment()" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem;">
        Pay with Razorpay
      </button>
    </ng-container>

    <ng-container *ngIf="step === 'processing'">
      <div style="text-align: center; padding: 3rem 1rem;">
        <div class="spinner" style="margin: 0 auto 1.5rem auto;"></div>
        <h3 style="color: var(--text-primary); margin-bottom: 0.5rem;">Initializing Razorpay...</h3>
        <p style="color: var(--text-secondary); margin: 0;">Please do not close this window.</p>
      </div>
    </ng-container>

    <ng-container *ngIf="step === 'success'">
      <div style="text-align: center; padding: 3rem 1rem; animation: fadeIn 0.5s ease-out;">
        <div style="width: 80px; height: 80px; border-radius: 50%; background: #2ed573; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto; color: white; font-size: 3rem;">
          ✓
        </div>
        <h3 style="color: #2ed573; margin-bottom: 0.5rem;">Payment Successful!</h3>
        <p style="color: var(--text-secondary); margin: 0;">Redirecting you to your bookings...</p>
      </div>
    </ng-container>

  </div>
</div>
